<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
</head>

<body>
    <script>
        /*
        /* 
        setTimeout() - Executa uma função após um determinado tempo.
         * setInterval() - Executa uma função repetidamente em um intervalo de tempo.
         * clearTimeout() - Cancela a execução de uma função agendada com setTimeout().
         * clearInterval() - Cancela a execução de uma função agendada com setInterval().
         
         // Exitem 3 formas de se utilizar o setTimeout() e o setInterval()
        
        setTimeout(() => {
            // executa oque estiver aqui dentro após o tempo definido
        }, timeout);
        
        setTimeout(() => {
            // executa oque estiver aqui dentro após o tempo definido
        }, timeout);
        
        function myFunction() {
            // executa oque estiver aqui dentro após o tempo definido
        }
        setTimeout(myFunction, timeout);
        
        */


    </script>
    <center>
        <h2>Exempo de setInterval</h2>
        <br>
        <h1>0</h1>
        <button onclick="stop()">Stop</button>
        <button onclick="start()">Start</button>
    </center>



    <br>

    <script>



    </script>


</body>
<script>
    /*
    setTimeout -> Executa uma vez
    setInterval -> Executa infinitas vezes
    clearInterval -> Vai pausar o setInterval
    */
    let number = 0
    let cron
    let h1 = document.querySelector("h1")

    function start() {
        cron = setInterval(function () {
            number++
            h1.innerHTML = number
        }, 1000)
    }

    function stop() {
        clearInterval(cron)

    }

</script>

</html>
