<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buscador de Contatos</title>
</head>

<body>

    <h1>while</h1>

    <input placeholder="Digite o nome do contato">

    <p></p>

    <button onclick="search()">Procurar Contato</button>

    <script>

        let p = document.querySelector('p')
        let input = document.querySelector('input')

        const contacts = [
            { name: 'Rodolfo', number: '(19)9445-5454' },
            { name: 'Cristiano', number: '(19)8455-2525' },
            { name: 'Cladinei', number: '(16)9445-7469' },
            { name: 'Neri', number: '(16)9445-8564' },
        ]

        function search() {

            let i = 0
            let encontrado = false

            while (i < contacts.length) {

                if (input.value.toLowerCase() === contacts[i].name.toLowerCase()) {

                    p.innerHTML = `Contato encontrado! Nome: ${contacts[i].name} - Tel: ${contacts[i].number}`

                    encontrado = true
                    break
                }

                i++
            }

            if (!encontrado) {
                p.innerHTML = "Contato não encontrado, tente novamente"
            }
        }

    </script>

</body>

</html>
